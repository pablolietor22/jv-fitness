# steps.yml — recibe repository_dispatch(type: steps) desde Tasker y publica steps.json en la rama data.
# Validación dura del payload: fecha YYYY-MM-DD, pasos 0..100000, hora HH:MM (opcional).
name: steps
on:
  repository_dispatch:
    types: [steps]
permissions:
  contents: write
concurrency:
  group: steps-data
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      FECHA: ${{ github.event.client_payload.fecha }}
      PASOS: ${{ github.event.client_payload.pasos }}
      HORA: ${{ github.event.client_payload.hora }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data   # la rama data debe existir (se crea una vez con los comandos de C.1)
      - name: Validar payload y escribir steps.json
        run: |
          set -eu
          echo "$FECHA" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "fecha invalida"; exit 1; }
          echo "$PASOS" | grep -Eq '^[0-9]{1,6}$' || { echo "pasos invalidos"; exit 1; }
          [ "$PASOS" -le 100000 ] || { echo "pasos fuera de rango"; exit 1; }
          if echo "$HORA" | grep -Eq '^([01][0-9]|2[0-3]):[0-5][0-9]$'; then
            printf '{"fecha":"%s","pasos":%s,"hora":"%s"}\n' "$FECHA" "$PASOS" "$HORA" > steps.json
          else
            printf '{"fecha":"%s","pasos":%s}\n' "$FECHA" "$PASOS" > steps.json
          fi
      - name: Commit y push (solo si cambio)
        run: |
          set -eu
          git config user.name "jvf-steps-bot"
          git config user.email "actions@users.noreply.github.com"
          git add steps.json
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "data: pasos $FECHA"
          git push origin data
