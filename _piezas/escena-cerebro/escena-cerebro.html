<style>

.jvce *{box-sizing:border-box}
.jvce-wrap{width:100%;max-width:560px;margin:0 auto;padding:0 18px}

.jvce-h b{color:var(--ce-jade)}
.jvce-orbe{display:grid;place-items:center;height:132px;margin:clamp(14px,3vw,22px) 0 4px}
.jvce-marco{border:1px solid var(--ce-line);border-radius:var(--ce-r);overflow:hidden;background:linear-gradient(180deg,var(--ce-panel),var(--ce-panel2));box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03)}
.jvce-barra{display:flex;align-items:center;gap:.6em;padding:11px 14px;font-size:.7rem;border-bottom:1px solid var(--ce-lines);font-family:var(--ce-mono);letter-spacing:.04em;color:var(--ce-soft)}
.jvce-vivo{width:7px;height:7px;border-radius:50%;background:var(--ce-jade);flex:none;box-shadow:0 0 8px var(--ce-jade)}
.jvce-barra i{margin-left:auto;color:var(--ce-mute2);font-size:.64rem;font-style:normal}
/* hidden, NO auto: el dedo del movil quedaba atrapado; el guion usa scrollTop. */
.jvce-hilo{height:clamp(320px,42vh,430px);overflow:hidden;padding:16px 14px 18px;display:flex;flex-direction:column;gap:12px;transition:opacity 380ms var(--ce-casa),transform 380ms var(--ce-casa)}
.jvce-hilo.se-va{opacity:0;transform:translateY(-10px)}
.jvce-b{max-width:88%;border-radius:14px;padding:11px 14px;font-size:.94rem;line-height:1.5;opacity:0;transform:translateY(16px);transition:opacity 420ms var(--ce-entra),transform 420ms var(--ce-entra)}
.jvce-b.in{opacity:1;transform:none}
.jvce-b--yo{align-self:flex-end;background:rgba(61,220,151,.13);color:var(--ce-bone);border:1px solid rgba(61,220,151,.3);border-bottom-right-radius:5px;transform:translateY(22px) scale(.96)}
.jvce-b--bot{align-self:flex-start;max-width:96%;background:rgba(12,21,18,.72);border:1px solid var(--ce-lines);border-bottom-left-radius:5px;color:var(--ce-soft)}
.jvce-b--bot b{color:var(--ce-bone);font-weight:600}
.jvce-bl,.jvce-li,.jvce-chip{opacity:0;transform:translateY(8px);transition:opacity 340ms var(--ce-entra),transform 340ms var(--ce-entra)}
.jvce-bl.in,.jvce-li.in,.jvce-chip.in{opacity:1;transform:none}
.jvce-tit{font-family:var(--ce-display);font-weight:700;color:var(--ce-bone);font-size:1.02rem;line-height:1.32;letter-spacing:-.01em}
.jvce-p{margin-top:9px}
.jvce-ol{margin:8px 0 0;padding-left:1.35em;list-style:decimal}
.jvce-li{margin:3px 0}
.jvce-fuente{margin-top:12px;border-left:2px solid var(--ce-jade);padding:2px 0 2px 10px;font-family:var(--ce-mono);font-size:.72rem;line-height:1.45;color:var(--ce-soft)}
.jvce-fuente span{display:block;color:var(--ce-jade);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:2px}
.jvce-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.jvce-chip{font-size:.74rem;line-height:1.35;padding:6px 11px;border-radius:100px;font-weight:500;border:1px solid var(--ce-line);color:var(--ce-jade);transform:translateY(6px) scale(.96)}
.jvce-sello{margin-top:12px;padding-top:8px;border-top:1px dashed var(--ce-lines);font-family:var(--ce-mono);font-size:.62rem;letter-spacing:.06em;color:var(--ce-mute2)}
.jvce-entrada{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--ce-lines);background:rgba(12,21,18,.5)}
.jvce-campo{flex:1;min-width:0;font-size:.92rem;color:var(--ce-bone);white-space:pre-wrap;overflow-wrap:anywhere}
/* :empty no casa (cursor hijo fijo): hueco por clase. */
.jvce-campo.esta-vacio::before{content:attr(data-hueco);color:var(--ce-mute2)}
.jvce-cursor{display:inline-block;width:2px;height:1.02em;background:var(--ce-jade);vertical-align:-.14em;margin-left:2px;opacity:0}
.jvce-enviar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ce-lines);color:var(--ce-mute2);transition:color .2s var(--ce-casa),border-color .2s var(--ce-casa),background .2s var(--ce-casa)}
.jvce-enviar.esta-listo{color:#05221a;background:var(--ce-jade);border-color:var(--ce-jade)}
.jvce-nota{margin:14px 0 0;font-family:var(--ce-mono);font-size:.68rem;line-height:1.6;color:var(--ce-mute2)}
.jvce-puntos{display:flex;gap:8px;margin-top:14px;justify-content:center}
.jvce-punto{width:26px;height:26px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.jvce-punto::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ce-mute2);transition:background .22s var(--ce-casa),transform .22s var(--ce-casa)}
.jvce-punto[aria-current="true"]::before{background:var(--ce-jade);transform:scale(1.3)}
/* Pausa (WCAG 2.2.2). */
.jvce-pausa{height:26px;padding:0 8px;border:1px solid var(--ce-lines);border-radius:100px;background:none;color:var(--ce-mute2);cursor:pointer;font-size:.72rem;line-height:1}
.jvce-pausa[aria-pressed="true"]{color:var(--ce-jade);border-color:var(--ce-jade)}
.jvce :focus-visible{outline:2px solid var(--ce-jade);outline-offset:3px;border-radius:4px}
.jvce.esta-en-pantalla .jvce-cursor{animation:jvce-parp 1.06s steps(1) infinite}
.jvce.esta-en-pantalla .jvce-vivo{animation:jvce-late 2.6s ease-in-out infinite}
/* Apagado por CLASE: la animacion pisa la opacity en linea. (0,3,0) y despues. */
.jvce .jvce-cursor.jvce-cursor--off{animation:none;opacity:0}
@keyframes jvce-parp{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes jvce-late{0%,100%{opacity:1}50%{opacity:.35}}
/* EL ORBE SE PARA fuera de pantalla: play-state no reinicia; (0,3,0) gana a .cb-orb. */
.jvce:not(.esta-en-pantalla) .cb-orb,
.jvce:not(.esta-en-pantalla) .cb-orb::before,
.jvce:not(.esta-en-pantalla) .cb-orb::after{animation-play-state:paused}
@media (min-width:640px){.jvce-wrap{max-width:600px;padding:0 22px}.jvce-hilo{height:430px}}
/* Movil: orbe a 96px (medido a 375px). */
@media (max-width:639px){.jvce-orbe{height:96px}.jvce-orbe .jv-orbe{transform:scale(.727)}}
/* REDUCIDO: cero animaciones (el guion ni arranca). SELECTOR DOBLADO: la media
   NO suma especificidad y anima '.jvce.esta-en-pantalla .jvce-cursor' (0,3,0);
   con (0,2,0) el cinturon PERDIA. 3a vez de esta trampa (anillos y luz del
   orbe): apagar con el mismo peso o mas, y DESPUES. */
@media (prefers-reduced-motion:reduce){
 .jvce.jvce .jvce-cursor{animation:none;opacity:0}
 .jvce.jvce .jvce-vivo{animation:none;opacity:1}
 .jvce .jvce-b,.jvce .jvce-bl,.jvce .jvce-li,.jvce .jvce-chip{transition:none;opacity:1;transform:none}
 .jvce .jvce-hilo,.jvce .jvce-enviar,.jvce .jvce-punto::before{transition:none}
 /* Ruta quieta: sin esto la respuesta quedaba CORTADA. */
 .jvce .jvce-hilo{height:auto}
}</style>

];
function arranque(){
var raiz=document.querySelector('[data-jv-escena-cerebro]');
if(!raiz) return;
function id(x){ return document.getElementById(x); }
var hilo=id('jvce_hilo'),campo=id('jvce_campo'),cursor=id('jvce_cur'),
   boton=id('jvce_env'),puntos=id('jvce_puntos');
/* Suelto: vestirse y declarar lang. */
var de=document.documentElement;
if(!getComputedStyle(de).getPropertyValue('--bg').trim()){
de.classList.add('jvce-suelta');
de.lang='es';
}
if(!id('jv-orbe-molde')){
var rep=id('jvce-orbe-repuesto');
if(rep) document.head.appendChild(rep.content.cloneNode(true));
}
var orbe=null,molde=id('jv-orbe-molde');
if(typeof jvOrbeCrear==='function') orbe=jvOrbeCrear('lg');
else if(molde) orbe=molde.content.firstElementChild.cloneNode(true);
if(orbe) id('jvce_orbe').appendChild(orbe);
function orbeEstado(e){
if(!orbe) return;
if(typeof jvOrbeEstado==='function') return jvOrbeEstado(orbe,e);
orbe.classList.toggle('jv-orbe--pensando',e==='pensando');
}
var quieto=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Al parar, gen++: las citas en vuelo no hacen nada. */
var gen=0,relojes=[],activa=false,idx=0,finPensar=null,pausado=false;
function cita(ms,fn){
var g=gen;
relojes.push(setTimeout(function(){ if(g===gen&&activa) fn(); },ms));
}
function parar(){
gen++; activa=false;
for(var i=0;i<relojes.length;i++) clearTimeout(relojes[i]);
relojes.length=0;
if(finPensar){ finPensar(); finPensar=null; }
orbeEstado('reposo');
raiz.classList.remove('esta-en-pantalla');
}
/* .in en la misma tarea no transiciona: offsetWidth fuerza el estado de partida. */
function pintar(el){ void el.offsetWidth; el.classList.add('in'); }
function nodo(t,c,h){
var e=document.createElement(t);
e.className=c;
if(h!=null) e.innerHTML=h;
return e;
}
function seguir(el){
var d=el.getBoundingClientRect().bottom-hilo.getBoundingClientRect().top
     +hilo.scrollTop-hilo.clientHeight+16;
if(d>hilo.scrollTop){
 if(hilo.scrollTo) hilo.scrollTo({top:d,behavior:quieto?'auto':'smooth'});
 else hilo.scrollTop=d;
}
}
function montar(f){
var caja=nodo('div','jvce-b jvce-b--bot'),pasos=[],t=0;
function add(el,dt){ t+=dt; pasos.push([t,el]); return el; }
caja.appendChild(add(nodo('div','jvce-bl jvce-tit',f.tit),0));
for(var i=0;i<f.cuerpo.length;i++){
 var p=f.cuerpo[i];
 if(p.k==='ol'){
  var ol=add(nodo('ol','jvce-bl jvce-ol'),T.BLOQUE);
  for(var j=0;j<p.items.length;j++) ol.appendChild(add(nodo('li','jvce-li',p.items[j]),T.ITEM));
  caja.appendChild(ol);
 } else caja.appendChild(add(nodo('div','jvce-bl jvce-p',p.h),T.BLOQUE));
}
caja.appendChild(add(nodo('div','jvce-bl jvce-fuente','<span>Fuente</span>'+f.fuente),T.FUENTE));
var chips=add(nodo('div','jvce-bl jvce-chips'),T.CHIPS);
for(var m=0;m<f.chips.length;m++) chips.appendChild(add(nodo('span','jvce-chip',f.chips[m]),T.CHIP));
caja.appendChild(chips);
caja.appendChild(add(nodo('div','jvce-bl jvce-sello',f.sello),T.SELLO));
return {caja:caja,pasos:pasos,fin:t};
}
function lectura(f){
var n=f.tit.length+f.fuente.length+f.chips.join('').length;
for(var i=0;i<f.cuerpo.length;i++)
 n+=(f.cuerpo[i].k==='ol')?f.cuerpo[i].items.join('').length:f.cuerpo[i].h.length;
return Math.min(T.LEE_TOPE,T.LEE+n*T.LEE_CHAR);
}
function limpiar(){
marcar();
hilo.classList.remove('se-va');
hilo.innerHTML='';
hilo.scrollTop=0;
campo.textContent='';
campo.appendChild(cursor);
campo.classList.add('esta-vacio');
boton.classList.remove('esta-listo');
orbeEstado('reposo');
}
function teclear(txt,fin){
var i=0;
cursor.classList.remove('jvce-cursor--off');
(function paso(){
 if(i>=txt.length){ cita(T.ENVIAR,fin); return; }
 var c=txt.charAt(i++);
 campo.insertBefore(document.createTextNode(c),cursor);
 if(i===1){ boton.classList.add('esta-listo'); campo.classList.remove('esta-vacio'); }
 var espera=T.TECLA+Math.random()*T.AZAR;
 if(c===','||c===':') espera+=T.COMA;
 if(c===' ') espera*=.7;
 cita(espera,paso);
})();
}
function ciclo(){
var f=GUION[idx];
limpiar();
teclear(f.q,function(){
 campo.textContent=''; campo.appendChild(cursor);
 campo.classList.add('esta-vacio');
 cursor.classList.add('jvce-cursor--off');
 boton.classList.remove('esta-listo');
 var yo=nodo('div','jvce-b jvce-b--yo',f.q);
 hilo.appendChild(yo); pintar(yo); seguir(yo);
 finPensar=(typeof jvOrbePensar==='function'&&orbe)?jvOrbePensar(orbe,T.PENSAR)
          :(orbeEstado('pensando'),function(){ orbeEstado('respondido'); });
 cita(T.PENSAR,function(){
  if(finPensar){ finPensar(); finPensar=null; }
  var m=montar(f);
  hilo.appendChild(m.caja); pintar(m.caja);
  for(var i=0;i<m.pasos.length;i++)
   (function(p){ cita(p[0],function(){ pintar(p[1]); seguir(p[1]); }); })(m.pasos[i]);
  cita(m.fin+lectura(f),function(){
   hilo.classList.add('se-va');
   cita(T.CORTE,function(){ idx=(idx+1)%GUION.length; ciclo(); });
  });
 });
});
}
/* Quieta. Sin 'esta-en-pantalla' el cursor ya es invisible. */
function estatica(){
var f=GUION[idx];
limpiar();
hilo.appendChild(nodo('div','jvce-b jvce-b--yo in',f.q));
var m=montar(f);
m.caja.classList.add('in');
for(var i=0;i<m.pasos.length;i++) m.pasos[i][1].classList.add('in');
hilo.appendChild(m.caja);
}
function marcar(){
var b=puntos.children;
for(var i=0;i<b.length;i++) b[i].setAttribute('aria-current',i===idx?'true':'false');
}
for(var n=0;n<GUION.length;n++)(function(k){
var b=document.createElement('button');
b.type='button'; b.className='jvce-punto';
b.setAttribute('aria-label','Ver la pregunta '+(k+1)+' de '+GUION.length);
b.addEventListener('click',function(){
 idx=k;
 if(quieto||pausado){ estatica(); return; }
 parar(); activa=true; raiz.classList.add('esta-en-pantalla'); ciclo();
});
puntos.appendChild(b);
})(n);
function encender(){
if(activa||quieto||pausado) return;
activa=true;
raiz.classList.add('esta-en-pantalla');
ciclo();
}
if(quieto||!('IntersectionObserver' in window)){ estatica(); return; }
var bp=nodo('button','jvce-pausa','⏸');
bp.type='button';
bp.setAttribute('aria-pressed','false');
bp.setAttribute('aria-label','Pausar o reanudar la animación');
bp.onclick=function(){
pausado=!pausado;
bp.setAttribute('aria-pressed',''+pausado);
bp.textContent=pausado?'▶':'⏸';
if(pausado) parar(); else if(dentro&&!document.hidden) encender();
};
puntos.appendChild(bp);
var dentro=false;
new IntersectionObserver(function(es){
for(var i=0;i<es.length;i++){
 dentro=es[i].isIntersecting;
 if(dentro&&!document.hidden) encender(); else parar();
}
},{threshold:.2}).observe(raiz);
document.addEventListener('visibilitychange',function(){
if(document.hidden) parar(); else if(dentro) encender();
});
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',arranque);
else arranque();
})();</script>
